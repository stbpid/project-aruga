  <script>
    // ── Section router (Profiling / Dashboard) ────────────────────
    const sectionProfiling = document.getElementById('section-profiling');
    const sectionDashboard = document.getElementById('section-dashboard');
    const heroAside        = document.getElementById('hero-aside');

    const navSwitch        = document.getElementById('nav-toggle-switch');
    const navThumb         = document.getElementById('nav-toggle-thumb');
    const navLabelProfiling = document.getElementById('nav-toggle-label-profiling');
    const navLabelDashboard = document.getElementById('nav-toggle-label-dashboard');

    const navSwitchMobile  = document.getElementById('nav-toggle-switch-mobile');
    const navThumbMobile   = document.getElementById('nav-toggle-thumb-mobile');
    const navLabelProfilingMobile = document.getElementById('nav-toggle-label-profiling-mobile');
    const navLabelDashboardMobile = document.getElementById('nav-toggle-label-dashboard-mobile');

    const formPanel = document.getElementById('form-panel');

    function updateSwitchUI(switchEl, thumbEl, labelProfilingEl, labelDashboardEl, isDashboard) {
      if (!switchEl) return;
      switchEl.setAttribute('aria-checked', String(isDashboard));

      const activeLabelEl = isDashboard ? labelDashboardEl : labelProfilingEl;
      const switchRect = switchEl.getBoundingClientRect();
      const labelRect  = activeLabelEl.getBoundingClientRect();

      thumbEl.style.width = `${labelRect.width}px`;
      thumbEl.style.left  = `${labelRect.left - switchRect.left}px`;

      labelProfilingEl.classList.toggle('text-white', !isDashboard);
      labelProfilingEl.classList.toggle('text-gray-500', isDashboard);
      labelDashboardEl.classList.toggle('text-white', isDashboard);
      labelDashboardEl.classList.toggle('text-gray-500', !isDashboard);
    }

    function showSection(isDashboard) {
      sectionProfiling.classList.toggle('hidden', isDashboard);
      sectionDashboard.classList.toggle('hidden', !isDashboard);

      const heroAsideImg = document.getElementById('hero-aside-img');
      if (heroAsideImg) {
        heroAsideImg.style.backgroundImage = isDashboard
          ? "url('/images/aruga-login-cover.webp')"
          : "url('/images/aruga-profiling-cover.webp')";
      }

      const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
      if (isDesktop) {
        // Aside is 5/12 wide, form panel is 7/12 wide — slide each across
        // to the other's position so they visually swap sides.
        heroAside.style.transform = isDashboard ? 'translateX(calc(700% / 5))' : '';
        formPanel.style.transform = isDashboard ? 'translateX(calc(-500% / 7))' : '';
      } else {
        heroAside.style.transform = '';
        formPanel.style.transform = '';
      }

      updateSwitchUI(navSwitch, navThumb, navLabelProfiling, navLabelDashboard, isDashboard);
      updateSwitchUI(navSwitchMobile, navThumbMobile, navLabelProfilingMobile, navLabelDashboardMobile, isDashboard);

      if (isDashboard) {
        setTimeout(() => document.getElementById('dash-email')?.focus(), 350);
      }
    }

    function routeFromHash() {
      showSection(window.location.hash === '#dashboard');
    }

    [navSwitch, navSwitchMobile].forEach(sw => {
      if (!sw) return;
      sw.addEventListener('click', () => {
        const isDashboard = window.location.hash === '#dashboard';
        window.location.hash = isDashboard ? '' : '#dashboard';
      });
    });

    let _resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(routeFromHash, 150);
    });

    window.addEventListener('hashchange', routeFromHash);
    routeFromHash();

    // Idle-logout notice, shown once when landing on the dashboard section
    document.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash === '#dashboard' && sessionStorage.getItem('logout_reason') === 'idle') {
        sessionStorage.removeItem('logout_reason');
        setTimeout(() => toast.error('You were logged out due to 30 minutes of inactivity.', 'Session Expired'), 300);
      }
    });

    // ── Dashboard login form ───────────────────────────────────────
    const dashEmailInput = document.getElementById('dash-email');
    const dashPwInput    = document.getElementById('dash-password');
    const dashBtnSubmit  = document.getElementById('dash-btn-submit');
    const dashTogglePw   = document.getElementById('dash-toggle-pw');
    const dashPwEyeShow  = document.getElementById('dash-pw-eye-show');
    const dashPwEyeHide  = document.getElementById('dash-pw-eye-hide');

    function dashValidate() {
      const email = dashEmailInput.value.trim();
      const pw    = dashPwInput.value;
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      dashBtnSubmit.disabled = !(emailOk && pw.length >= 1);
    }

    dashEmailInput.addEventListener('input', dashValidate);
    dashPwInput.addEventListener('input', dashValidate);

    dashTogglePw.addEventListener('click', () => {
      const isText = dashPwInput.type === 'text';
      dashPwInput.type = isText ? 'password' : 'text';
      dashPwEyeShow.classList.toggle('hidden', !isText);
      dashPwEyeHide.classList.toggle('hidden', isText);
    });

    const dashBtnGoogle = document.getElementById('dash-btn-google');
    dashBtnGoogle.addEventListener('click', () => {
      document.getElementById('google-unavailable-modal').classList.add('open');
    });
    function closeGoogleUnavailableModal() {
      document.getElementById('google-unavailable-modal').classList.remove('open');
    }

    const DASH_ROLE_REDIRECT = {
      admin:          '/dashboard-admin',
      central:        '/dashboard-central',
      stu_head:       '/dashboard-stu-head',
      field_officer:  '/dashboard-field-officer',
    };

    dashBtnSubmit.addEventListener('click', async function() {
      const email    = dashEmailInput.value.trim().toLowerCase();
      const password = dashPwInput.value;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast.error('Please enter a valid email address.'); return; }
      if (!password) { toast.error('Please enter your password.'); return; }

      const orig = dashBtnSubmit.textContent;
      dashBtnSubmit.textContent = 'Signing in...';
      dashBtnSubmit.disabled = true;

      try {
        const res = await fetch('/api/auth-router.php?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await res.json();

        if (result.success && result.data) {
          const d = result.data;
          sessionStorage.setItem('session_id',           d.session_id       || '');
          sessionStorage.setItem('interviewer_id',       d.id               || '');
          sessionStorage.setItem('interviewer_code',     d.interviewer_code || '');
          sessionStorage.setItem('interviewer_name',     d.full_name        || '');
          sessionStorage.setItem('interviewer_email',    d.email            || '');
          sessionStorage.setItem('interviewer_region',   d.region           || '');
          sessionStorage.setItem('interviewer_province', d.province         || '');
          sessionStorage.setItem('interviewer_office',   d.office           || '');
          sessionStorage.setItem('session_started_at',   d.started_at       || '');
          sessionStorage.setItem('dashboard_role',       d.role             || 'field_officer');
          sessionStorage.setItem('loginTime',            new Date().toISOString());

          toast.success(`Welcome, ${d.full_name}!`, 'Login Successful');
          dashBtnSubmit.textContent = '✓ Success! Redirecting...';

          const role = (d.role || '').trim().toLowerCase();
          const redirect = DASH_ROLE_REDIRECT[role] || '/dashboard-admin';
          setTimeout(() => { window.location.href = redirect; }, 1000);
        } else {
          toast.error(result.message || 'Invalid email or password.', 'Login Failed');
          dashBtnSubmit.textContent = orig;
          dashBtnSubmit.disabled = false;
          dashPwInput.value = '';
          dashPwInput.focus();
          dashValidate();
        }
      } catch {
        toast.error('Unable to connect to the server. Check your internet connection.', 'Connection Error');
        dashBtnSubmit.textContent = orig;
        dashBtnSubmit.disabled = false;
      }
    });

    [dashEmailInput, dashPwInput].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && !dashBtnSubmit.disabled) dashBtnSubmit.click(); });
    });
  </script>
