<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Aruga Profiling Tool Pre-Test v3</title>
  <link rel="icon" href="images/logo.webp" type="image/webp">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/v2.css">
  <link rel="stylesheet" href="css/pretest.css">
</head>
<body class="bg-gray-50 text-gray-800 h-[100dvh] overflow-hidden flex flex-col font-sans">

  <!-- QUICK GUIDE MODAL (opened from the info icon on the landing card) -->
  <div id="guide-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="guide-title">
    <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm" onclick="hideGuideModal()"></div>
    <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden">
      <div class="flex items-center gap-3 px-5 py-4 border-b border-gray-100">
        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-[18px] text-brand-blue">menu_book</span>
        </div>
        <h3 id="guide-title" class="font-bold text-brand-dark text-base flex-1">Interviewer quick guide</h3>
        <button type="button" onclick="hideGuideModal()" aria-label="Close" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-gray-100">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>
      <ol id="guide-list" class="px-5 py-4 space-y-2.5 overflow-y-auto"></ol>
      <div class="px-5 py-3 border-t border-gray-100 flex justify-end">
        <button type="button" onclick="hideGuideModal()" class="px-5 h-9 bg-brand-blue rounded-lg text-white font-bold text-xs sm:text-sm hover:bg-brand-blueHover shadow-md transition-all">Got it</button>
      </div>
    </div>
  </div>

  <!-- LANDING — login gate before the form -->
  <div id="landing-view" class="flex-1 min-h-0 flex flex-col">
    <header class="relative w-full pt-4">
      <div class="px-4 sm:px-6">
        <div class="max-w-5xl mx-auto rounded-xl px-4 sm:px-5 h-14 flex items-center justify-between border border-gray-200/80 bg-white shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
          <div class="flex items-center gap-3">
            <img src="images/logo.webp" alt="Project Aruga logo" class="h-9 w-9 object-contain rounded-full">
            <h2 class="font-bold text-brand-dark text-sm sm:text-base leading-tight whitespace-nowrap">Project Aruga</h2>
          </div>
          <div class="flex items-center gap-5">
            <nav class="hidden md:flex items-center gap-5 text-xs font-medium text-gray-600">
              <a href="privacy.html" class="hover:text-brand-blue transition-colors">Privacy Policy</a>
              <a href="#" onclick="return false" class="hover:text-brand-blue transition-colors">Documentation</a>
              <a href="#" onclick="return false" class="hover:text-brand-blue transition-colors">Contact us</a>
            </nav>
            <div id="net-status" class="relative"></div>
            <span class="hidden sm:flex px-3 h-7 rounded-md bg-brand-blue text-white text-[11px] font-bold items-center shadow-sm whitespace-nowrap">Profiling Pre-Test v3</span>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 min-h-0 flex items-center justify-center px-4 sm:px-6 py-4 sm:py-5">
      <div id="landing-card" class="bg-white rounded-2xl shadow-[0_8px_40px_rgba(0,0,0,0.08)] w-full max-w-5xl max-h-full lg:h-full flex flex-col lg:flex-row overflow-hidden">
        <aside class="w-full min-h-0 basis-28 sm:basis-40 shrink-[50] lg:basis-auto lg:shrink-0 lg:h-auto lg:w-5/12 bg-brand-blue overflow-hidden">
          <div class="w-full h-full" style="background-image:url('images/aruga-profiling-cover.webp');background-size:cover;background-position:center;background-repeat:no-repeat;"></div>
        </aside>

        <section id="landing-panel" class="w-full flex-auto min-h-0 lg:w-7/12 px-6 py-6 sm:px-10 flex flex-col overflow-y-auto">
          <div class="my-auto w-full max-w-xl">
            <img src="images/form-logo.webp" alt="DSWD logo" class="h-10 sm:h-11 w-auto object-contain mb-3">
            <div class="flex items-center gap-1.5 mb-3">
              <h1 class="font-bold text-lg sm:text-xl text-brand-dark">Project Aruga Profiling Tool Pre-Test</h1>
              <button type="button" onclick="showGuideModal()" title="Interviewer quick guide" aria-label="Interviewer quick guide" class="w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:text-brand-blue hover:bg-blue-50 transition-colors">
                <span class="material-symbols-outlined text-[18px]">info</span>
              </button>
            </div>

            <label class="flex items-center gap-3 mb-4 cursor-pointer select-none">
              <input type="checkbox" id="land-agree" class="h-4 w-4 shrink-0 cursor-pointer rounded border-gray-400 accent-[#1152d4]">
              <span class="text-[11px] sm:text-xs text-brand-dark leading-snug">I understand the <a href="privacy.html" class="underline hover:no-underline text-brand-blue">Data Privacy Terms and Conditions</a> for data processing.</span>
            </label>

            <label for="land-lang_trigger" class="block font-bold text-xs sm:text-sm mb-1 text-brand-dark">Language</label>
            <div class="relative mb-3" data-dropdown="land-lang">
              <select id="land-lang" class="sr-only">
                <option value="en" selected>English</option>
                <option value="tl" disabled>Tagalog (Translation not available)</option>
              </select>
              <button type="button" id="land-lang_trigger" onclick="toggleLangDropdown()" class="w-full h-10 pl-3 pr-10 rounded-md border border-gray-300 bg-white text-left text-xs sm:text-sm text-gray-800 outline-none focus:border-brand-blue focus:ring-1 focus:ring-brand-blue cursor-pointer">English</button>
              <svg class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              <div id="land-lang_panel" class="hidden absolute z-20 mt-1 w-full max-h-64 overflow-y-auto thin-scroll bg-white border border-gray-200 rounded-lg shadow-lg py-1">
                <button type="button" class="dropdown-option is-selected w-full text-left px-3 py-2 text-xs sm:text-sm text-gray-700 hover:bg-blue-50" onclick="toggleLangDropdown()">English</button>
                <button type="button" disabled class="dropdown-option w-full text-left px-3 py-2 text-xs sm:text-sm text-gray-400 cursor-not-allowed">Tagalog (Translation not available)</button>
              </div>
            </div>

            <label for="land-code" class="block font-bold text-xs sm:text-sm mb-1 text-brand-dark">Interviewer Code</label>
            <div class="flex items-center gap-3 h-10 px-3 mb-4 rounded-md border border-gray-300 bg-white focus-within:border-brand-blue focus-within:ring-1 focus-within:ring-brand-blue transition-all">
              <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
              <input id="land-code" type="text" maxlength="8" autocomplete="off" spellcheck="false" class="w-full text-xs sm:text-sm outline-none text-gray-800 placeholder-gray-400" placeholder="Enter 8-digit code">
            </div>

            <button id="land-submit" type="button" disabled class="w-full h-10 bg-brand-blue text-white text-xs sm:text-sm rounded-lg font-bold hover:bg-brand-blueHover disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-brand-blue transition-all shadow-md flex items-center justify-between px-4">
              <span id="land-submit-label">Submit and Proceed</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
            </button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <footer class="relative w-full pt-1 pb-4 text-center px-4">
    <p class="text-[10px] text-gray-400">© 2026 Department of Social Welfare Development - <a href="https://stb.dswd.gov.ph/" target="_blank" rel="noopener noreferrer" class="text-brand-blue">Social Technology Bureau</a></p>
  </footer>

  <script src="js/toast.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pretest-api.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
